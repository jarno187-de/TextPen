<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="__BASE__"><title>TextPen Control</title><link rel="stylesheet" href="control.css"><script src="panel.js"></script></head>
<body><div class="shell"><aside class="sidebar"><a class="brand" href="./"><span class="brand-icon">TP</span>TEXTPEN</a><nav aria-label="Verwaltung"><button data-view="overview" class="nav-item active"><span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Übersicht</button><button data-view="operations" class="nav-item"><span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v9M6.3 5.7a9 9 0 1 0 11.4 0"/></svg></span> Betrieb & Hinweise</button><button data-view="pages" class="nav-item"><span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span> Seiten & Funktionen</button><button data-view="analytics" class="nav-item"><span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v18h18M7 16v-5M12 16V7M17 16V4"/></svg></span> Statistiken</button><button data-view="reviews" class="nav-item"><span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9Z"/></svg></span> Bewertungen <span id="reviews-count" class="pill warning nav-count" hidden></span></button><button data-view="security" class="nav-item"><span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3 3 7v5c0 5 9 9 9 9s9-4 9-9V7Z"/><path d="m8 12 3 3 5-6"/></svg></span> Sicherheit</button><button data-view="releases" class="nav-item"><span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 10 5-10 5L2 8Zm-10 9 10 5 10-5M2 16l10 5 10-5"/></svg></span> Versionen & Backups</button><button data-view="activity" class="nav-item"><span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span> Protokoll</button></nav><div class="sidebar-bottom"><button id="logout" class="quiet">Abmelden <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4H4v16h5M9 12h12m-4-4 4 4-4 4"/></svg></button></div></aside><main class="main"><header class="topbar"><div><div class="breadcrumb" id="breadcrumb">Übersicht</div></div><div class="top-actions"><button id="theme-toggle" class="quiet theme-toggle" type="button" aria-label="Dunkelmodus einschalten"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg> Dunkelmodus</button><button id="logout-mobile" class="quiet mobile-only"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4H4v16h5M9 12h12m-4-4 4 4-4 4"/></svg>Abmelden</button><span id="sync-status" class="muted">Verbinde …</span><button id="refresh" class="quiet"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7a9 9 0 0 0-15-2L2 8m0-5v5h5M4 17a9 9 0 0 0 15 2l3-3m0 5v-5h-5"/></svg> Aktualisieren</button><a href="https://textpen.de/" target="_blank" rel="noreferrer" class="button-link">Website öffnen <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></a></div></header><div id="notice" class="notice" role="status" hidden></div><div id="content" aria-live="polite"><div class="loading">Steuerzentrale wird geladen …</div></div></main></div>
<dialog id="confirm-dialog"><form id="confirmation"><h2 id="confirm-title">Änderung bestätigen</h2><p id="confirm-description"></p><div id="reauth-fields" hidden><label for="confirm-password">Passwort</label><input id="confirm-password" type="password" autocomplete="current-password" maxlength="256"><label for="confirm-code">Frischer Google-Authenticator-Code</label><input id="confirm-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><p class="field-note">Ein bereits verwendeter Code kann nicht erneut verwendet werden.</p></div><div class="dialog-actions"><button id="confirm-cancel" type="button" class="quiet">Abbrechen</button><button type="submit" class="primary">Bestätigen</button></div></form></dialog>
</body></html>
