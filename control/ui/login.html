<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="__BASE__"><title>TextPen · Zugang</title><link rel="stylesheet" href="control.css"><script src="login.js"></script></head>
<body class="login-page"><button id="theme-toggle" class="quiet theme-toggle" type="button" aria-label="Dunkelmodus einschalten"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg> Dunkelmodus</button><main class="login-card"><div class="login-brand"><a class="brand" href="https://textpen.de/"><span class="brand-icon">TP</span>TEXTPEN</a></div><h1>Anmelden</h1><form id="login"><label for="password">Passwort</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required autofocus><label for="code">Google Authenticator</label><input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required><button class="primary wide" type="submit">Sicher anmelden <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button><p id="login-error" class="error" role="alert" hidden></p></form></main></body></html>
